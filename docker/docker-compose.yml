version: "3.9"

# =============================================================================
# Atlas — AI Financial Assistant
# Docker Compose: 7 services
# =============================================================================

services:

  # ── App: FastAPI + Uvicorn ──────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: atlas-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://atlas:atlaspassword@postgres:5432/atlas_db
      - REDIS_URL=redis://redis:6379/0
      - MCP_GOOGLE_WORKSPACE_URL=http://mcp-google-workspace:3000
      - STORAGE_LOCAL_PATH=/app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Worker: Arq job queue ───────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: atlas-worker
    restart: unless-stopped
    command:
      - arq
      - app.workers.worker_settings.WorkerSettings
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://atlas:atlaspassword@postgres:5432/atlas_db
      - REDIS_URL=redis://redis:6379/0
      - MCP_GOOGLE_WORKSPACE_URL=http://mcp-google-workspace:3000
      - STORAGE_LOCAL_PATH=/app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlaspassword
      POSTGRES_DB: atlas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Nginx: TLS termination + reverse proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: atlas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal
      - external

  # ── Google Workspace MCP Server ─────────────────────────────────────────────
  # Self-hosted, internal only — no public ports, not routed through Nginx.
  # Version is pinned; bumped deliberately like any other dependency.
  mcp-google-workspace:
    image: modelcontextprotocol/google-workspace:latest
    container_name: atlas-mcp-google
    restart: unless-stopped
    environment:
      # The MCP server operates in passthrough/bearer-token mode.
      # Atlas hands per-request tokens; the server does NOT manage its own credential store.
      - MCP_AUTH_MODE=passthrough
      - MCP_READ_ONLY=true  # Disable write tools by default (least privilege)
    # IMPORTANT: No host port mapping — internal network only.
    networks:
      - internal

  # ── DB Migration Job (runs once at startup) ─────────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: atlas-migrate
    command: alembic upgrade head
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://atlas:atlaspassword@postgres:5432/atlas_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - external
    restart: "no"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
  external:
    driver: bridge
