[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-financial-assistant"
version = "0.1.0"
description = "Atlas — AI Financial Assistant for Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",

    # AI / LLM orchestration
    "langgraph>=0.2.55",
    "langchain-core>=0.3.27",
    "langchain-openai>=0.2.14",
    "openai>=1.58.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.5",

    # Redis / job queue
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.1",

    # Validation / settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Logging
    "structlog>=24.4.0",

    # Security / encryption
    "cryptography>=43.0.0",

    # Document processing
    "pdfplumber>=0.11.4",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.20",
    "cloudinary>=1.41.0",

    # Telegram
    "python-telegram-bot[webhooks]>=21.9",

    # MCP client
    "mcp>=1.0.0",

    # Utilities
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "tiktoken>=0.8.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
